<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conectar MetaMask - Connect EVM</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0f0f0f;
      color: #fff;
    }
    #connectMetaMask {
      padding: 14px 28px;
      background: #f6851b;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    #connectMetaMask:hover {
      background: #e2761b;
      transform: translateY(-1px);
    }
    #connectMetaMask:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #walletAddress {
      margin-top: 16px;
      font-size: 15px;
      color: #a1a1aa;
    }
    .connected {
      background: #22c55e !important;
    }
  </style>
</head>
<body>

  <button id="connectMetaMask">🦊 Conectar MetaMask</button>
  <p id="walletAddress"></p>

  <script type="module">
    import { createEVMClient, getInfuraRpcUrls } from 'https://cdn.jsdelivr.net/npm/@metamask/connect-evm@latest/+esm';

    const connectBtn = document.getElementById('connectMetaMask');
    const addressDisplay = document.getElementById('walletAddress');

    let evmClient = null;

    // Inicializa o client
    async function initClient() {
      evmClient = await createEVMClient({
        dapp: {
          name: 'Minha Dapp',
          url: window.location.href,
          // iconUrl: 'https://seudominio.com/icon.png', // opcional
        },
        api: {
          // Coloque sua Infura API Key aqui (recomendado para produção)
          supportedNetworks: {
            ...getInfuraRpcUrls({ infuraApiKey: 'SUA_INFURA_API_KEY' }),
            // Ou adicione manualmente:
            // '0x1': 'https://mainnet.infura.io/v3/SUA_KEY',
            // '0xaa36a7': 'https://sepolia.infura.io/v3/SUA_KEY',
          },
        },
      });
    }

    connectBtn.addEventListener('click', async () => {
      try {
        connectBtn.disabled = true;
        connectBtn.textContent = 'Conectando...';

        if (!evmClient) {
          await initClient();
        }

        // Conecta (funciona com extensão e mobile)
        const { accounts, chainId } = await evmClient.connect({
          chainIds: ['0x1', '0xaa36a7'], // Ethereum Mainnet + Sepolia
        });

        const account = accounts[0];

        addressDisplay.textContent = `✅ Conectado: \( {account.slice(0, 6)}... \){account.slice(-4)} | Chain: ${chainId}`;
        connectBtn.textContent = '✅ Carteira Conectada';
        connectBtn.classList.add('connected');

        // Opcional: escuta mudanças de conta e rede
        const provider = evmClient.getProvider();
        provider.on('accountsChanged', (accounts) => {
          if (accounts.length === 0) {
            // Desconectou
            addressDisplay.textContent = '';
            connectBtn.textContent = '🦊 Conectar MetaMask';
            connectBtn.classList.remove('connected');
          } else {
            addressDisplay.textContent = `✅ Conectado: \( {accounts[0].slice(0, 6)}... \){accounts[0].slice(-4)}`;
          }
        });

        provider.on('chainChanged', (chainId) => {
          console.log('Rede alterada para:', chainId);
          // Opcional: window.location.reload();
        });

      } catch (error) {
        if (error.code === 4001) {
          addressDisplay.textContent = '❌ Conexão recusada pelo usuário';
        } else if (error.code === -32002) {
          addressDisplay.textContent = '⏳ Já existe uma solicitação pendente';
        } else {
          addressDisplay.textContent = '❌ Erro na conexão';
          console.error(error);
        }
        connectBtn.textContent = '🦊 Conectar MetaMask';
      } finally {
        connectBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
